<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Animated gradient background -->
    <linearGradient id="hdrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#1A0533">
        <animate attributeName="stop-color" values="#1A0533;#6B21A8;#1A0533" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%"  stop-color="#6B21A8">
        <animate attributeName="stop-color" values="#6B21A8;#F97316;#6B21A8" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#F97316">
        <animate attributeName="stop-color" values="#F97316;#1A0533;#F97316" dur="9s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Name gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#F5E6FF"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Orbit paths (for decorative dots) -->
    <path id="orbit"  d="M 726,148 a 72,72 0 1,1 0.01,0"/>
    <path id="orbit2" d="M 853,148 a 55,55 0 1,1 0.01,0"/>
