<svg width="900" height="130" viewBox="0 0 900 130" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="130" rx="12"
        fill="#0D1117"/>
  
  <g opacity="0">
    <rect x="30" y="12" width="195" height="106" rx="10"
          fill="#6B21A8" stroke="#C084FC" stroke-width="1.5" stroke-opacity="0.45"/>
    <!-- Top accent strip -->
    <rect x="30" y="12" width="195" height="5" rx="2.5" fill="#C084FC"/>
    <!-- Shine sweep -->
    <rect x="30" y="12" width="0" height="106" rx="10" fill="#C084FC" opacity="0.06">
      <animate attributeName="width" values="0;195;0" dur="2s"
               begin="0.3s" fill="freeze" calcMode="spline" keySplines="0.4,0,0.2,1"/>
    </rect>
    <text x="127" y="52" text-anchor="middle" font-size="24">📁</text>
    <text x="127" y="84" text-anchor="middle"
          fill="#F5E6FF" font-size="28" font-weight="800"
          font-family="Arial Black, Arial, sans-serif">98</text>
    <text x="127" y="104" text-anchor="middle"
          fill="#DDB3FF" font-size="11.5" font-family="Arial, sans-serif">Repositories</text>
    <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.0s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,12;0,0" dur="0.45s" begin="0.0s" fill="freeze" additive="sum"/>
  </g>
  <g opacity="0">
    <rect x="245" y="12" width="195" height="106" rx="10"
          fill="#6B21A8" stroke="#E3B341" stroke-width="1.5" stroke-opacity="0.45"/>
    <!-- Top accent strip -->
    <rect x="245" y="12" width="195" height="5" rx="2.5" fill="#E3B341"/>
    <!-- Shine sweep -->
    <rect x="245" y="12" width="0" height="106" rx="10" fill="#E3B341" opacity="0.06">
      <animate attributeName="width" values="0;195;0" dur="2s"
               begin="0.44999999999999996s" fill="freeze" calcMode="spline" keySplines="0.4,0,0.2,1"/>
    </rect>
    <text x="342" y="52" text-anchor="middle" font-size="24">⭐</text>
    <text x="342" y="84" text-anchor="middle"
          fill="#F5E6FF" font-size="28" font-weight="800"
          font-family="Arial Black, Arial, sans-serif">0</text>
    <text x="342" y="104" text-anchor="middle"
          fill="#DDB3FF" font-size="11.5" font-family="Arial, sans-serif">Total Stars</text>
    <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.15s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,12;0,0" dur="0.45s" begin="0.15s" fill="freeze" additive="sum"/>
  </g>
  <g opacity="0">
    <rect x="460" y="12" width="195" height="106" rx="10"
          fill="#6B21A8" stroke="#3FB950" stroke-width="1.5" stroke-opacity="0.45"/>
    <!-- Top accent strip -->
    <rect x="460" y="12" width="195" height="5" rx="2.5" fill="#3FB950"/>
    <!-- Shine sweep -->
    <rect x="460" y="12" width="0" height="106" rx="10" fill="#3FB950" opacity="0.06">
      <animate attributeName="width" values="0;195;0" dur="2s"
               begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.4,0,0.2,1"/>
    </rect>
    <text x="557" y="52" text-anchor="middle" font-size="24">👥</text>
    <text x="557" y="84" text-anchor="middle"
          fill="#F5E6FF" font-size="28" font-weight="800"
          font-family="Arial Black, Arial, sans-serif">3</text>
    <text x="557" y="104" text-anchor="middle"
          fill="#DDB3FF" font-size="11.5" font-family="Arial, sans-serif">Followers</text>
    <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.3s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,12;0,0" dur="0.45s" begin="0.3s" fill="freeze" additive="sum"/>
  </g>
  <g opacity="0">
    <rect x="675" y="12" width="195" height="106" rx="10"
          fill="#6B21A8" stroke="#F85149" stroke-width="1.5" stroke-opacity="0.45"/>
    <!-- Top accent strip -->
    <rect x="675" y="12" width="195" height="5" rx="2.5" fill="#F85149"/>
    <!-- Shine sweep -->
    <rect x="675" y="12" width="0" height="106" rx="10" fill="#F85149" opacity="0.06">
      <animate attributeName="width" values="0;195;0" dur="2s"
               begin="0.75s" fill="freeze" calcMode="spline" keySplines="0.4,0,0.2,1"/>
    </rect>
    <text x="772" y="52" text-anchor="middle" font-size="24">🔀</text>
    <text x="772" y="84" text-anchor="middle"
          fill="#F5E6FF" font-size="28" font-weight="800"
          font-family="Arial Black, Arial, sans-serif">0</text>
    <text x="772" y="104" text-anchor="middle"
          fill="#DDB3FF" font-size="11.5" font-family="Arial, sans-serif">Total Forks</text>
    <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.44999999999999996s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,12;0,0" dur="0.45s" begin="0.44999999999999996s" fill="freeze" additive="sum"/>
  </g>
</svg>